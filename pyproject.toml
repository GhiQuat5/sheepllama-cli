[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sheepllama-cli"
version = "0.1.0"
description = "Fast Groq CLI powered by Llama models"
readme = "README.md"
requires-python = ">=3.10, <3.15"
dependencies = [
    "groq>=0.9.0",
    "rich>=13.0.0"
]

[project.scripts]
sheepllama = "sheepllama.cli:main"
